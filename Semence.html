<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suivi Semence Mâles</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: #0a1520;
    font-family: 'Courier New', monospace;
    color: #c8d8e8;
    overflow-x: hidden;
  }
  header {
    background: linear-gradient(135deg, #0d1e2e, #122033);
    border-bottom: 2px solid #1e4060;
    padding: 14px 20px;
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 10px;
  }
  .header-title-sub { font-size: 10px; color: #4a8cb0; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 4px; }
  .header-title { font-size: 20px; font-weight: 700; color: #e8f4ff; letter-spacing: 1px; }
  .header-logo { height: 48px; width: auto; filter: drop-shadow(0 0 4px rgba(80,140,255,0.3)); }
  .header-brand { display: flex; align-items: center; gap: 14px; }
  .header-right { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  input[type=date] {
    background: #1a2e42; border: 1px solid #2a4a68; border-radius: 6px;
    color: #c8d8e8; padding: 8px 12px; font-family: inherit; font-size: 14px; cursor: pointer;
  }
  .btn-bilan {
    background: #1a3a5c; border: 1px solid #2a5a8c; border-radius: 6px;
    color: #7ab8e0; padding: 8px 14px; font-family: inherit; font-size: 11px;
    cursor: pointer; letter-spacing: 1px; text-transform: uppercase;
  }
  .btn-bilan:hover { filter: brightness(1.2); }
  #saving { font-size: 11px; color: #4a8cb0; }
  .layout { display: flex; min-height: calc(100vh - 80px); overflow: hidden; }
  nav {
    width: 52px; background: #0d1a28; border-right: 2px solid #1a3048;
    display: flex; flex-direction: column; padding-top: 12px; gap: 2px; flex-shrink: 0; overflow-y: auto;
  }
  .allee-btn {
    background: transparent; border: none; border-left: 3px solid transparent;
    color: #4a6a8a; font-family: inherit; font-weight: 700; font-size: 16px;
    padding: 13px 0; cursor: pointer; transition: all 0.15s; letter-spacing: 1px; width: 100%;
  }
  .allee-btn.active { background: #1a4a7a; border-left-color: #3a8cc8; color: #e8f4ff; }
  .allee-btn:hover:not(.active) { color: #7ab8e0; }
  main { flex: 1; padding: 18px; overflow-y: auto; }
  .main-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px; flex-wrap: wrap; gap: 10px;
  }
  .allee-title { font-size: 26px; font-weight: 700; color: #e8f4ff; letter-spacing: 2px; }
  .allee-title span { color: #3a8cc8; }
  .stats { display: flex; gap: 10px; flex-wrap: wrap; }
  .stat-box {
    background: #0d1a28; border: 1px solid #1a3048; border-radius: 8px;
    padding: 7px 12px; text-align: center;
  }
  .stat-val { font-size: 18px; font-weight: 700; }
  .stat-val span { font-size: 12px; font-weight: 400; opacity: 0.8; }
  .stat-lbl { font-size: 9px; color: #4a6a8a; letter-spacing: 1px; text-transform: uppercase; }
  .progress-wrap { display: flex; background: #1a2e42; border-radius: 4px; height: 6px; margin-bottom: 20px; overflow: hidden; }
  .progress-bar { height: 100%; transition: width 0.3s; }
  .legend { display: flex; gap: 16px; margin-bottom: 14px; font-size: 11px; color: #4a6a8a; letter-spacing: 1px; flex-wrap: wrap; align-items: center; }
  .grid {
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    gap: 5px;
    max-width: 680px;
  }

  /* ---- CAGES ---- */
  .cage {
    background: #1e2a35; border: 1.5px solid #2a3a4a; border-radius: 6px;
    color: #4a6070; font-family: inherit; font-weight: 700;
    padding: 9px 4px 5px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    transition: all 0.12s; user-select: none; line-height: 1;
    -webkit-tap-highlight-color: transparent;
  }
  .cage:hover:not(.femelle) { filter: brightness(1.2); }
  .cage .icon { font-size: 15px; }
  .cage .lbl { font-size: 9px; opacity: 1; font-weight: 800; color: #ffffff; letter-spacing: 0.5px; }

  .cage.donne    { background: #0d3d1f; border-color: #16a34a; color: #4ade80; }
  .cage.moyen    { background: #3d2800; border-color: #d97706; color: #fb923c; }
  .cage.nondonne { background: #3d0d0d; border-color: #dc2626; color: #f87171; }

  /* Femelles : rayures diagonales, non cliquable */
  .cage.femelle {
    cursor: not-allowed;
    background: repeating-linear-gradient(
      45deg,
      #0f1e2e 0px, #0f1e2e 4px,
      #1a2e42 4px, #1a2e42 9px
    );
    border-color: #1a3a5a;
    color: #2a5070;
    opacity: 0.75;
  }
  .cage.femelle .icon { font-size: 12px; }

  .quick-actions { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
  .qa-btn {
    border: 1px solid; border-radius: 6px; font-family: inherit;
    font-size: 11px; padding: 8px 14px; cursor: pointer;
    letter-spacing: 1px; text-transform: uppercase;
  }
  /* Modal */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8);
    align-items: center; justify-content: center; z-index: 100;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: #0d1e2e; border: 2px solid #1e4060; border-radius: 12px;
    padding: 24px; min-width: 500px; max-width: 700px; max-height: 90vh; overflow-y: auto;
  }
  .modal-title { font-size: 12px; color: #4a8cb0; letter-spacing: 2px; margin-bottom: 14px; text-transform: uppercase; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { color: #4a8cb0; border-bottom: 1px solid #1e3a50; padding: 6px 7px; text-align: center; }
  th:first-child { text-align: left; }
  td { padding: 7px 7px; text-align: center; border-bottom: 1px solid #0f2030; }
  td:first-child { text-align: left; font-weight: 700; color: #7ab8e0; }
  tr.total-row td { border-top: 2px solid #1e4060; font-weight: 700; }
  .btn-close {
    margin-top: 18px; width: 100%; background: #1a3a5c; border: 1px solid #2a5a8c;
    border-radius: 6px; color: #7ab8e0; padding: 10px; font-family: inherit;
    font-size: 12px; cursor: pointer; letter-spacing: 1px; text-transform: uppercase;
  }
  .ldot {
    display: inline-block; width: 10px; height: 10px; border-radius: 2px;
    margin-right: 4px; vertical-align: middle;
  }

  /* ===== RESPONSIVE MOBILE ===== */
  @media (max-width: 640px) {

    /* ----- Header ----- */
    header {
      padding: 8px 10px;
      gap: 6px;
    }
    .header-title { font-size: 14px; }
    .header-logo { height: 32px; }
    .header-brand { gap: 8px; }
    .header-right {
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }
    input[type=date] {
      font-size: 12px;
      padding: 5px 7px;
      flex: 1 1 120px;
    }
    .btn-bilan {
      font-size: 10px;
      padding: 5px 8px;
    }
    #saving { font-size: 10px; }

    /* ----- Layout : abandon hauteur fixe, page normale ----- */
    .layout {
      display: block !important;
      height: auto !important;
      min-height: unset !important;
    }

    /* ----- Nav allées : bandeau horizontal ----- */
    nav {
      width: 100% !important;
      height: auto !important;
      flex-direction: row !important;
      overflow-x: auto !important;
      overflow-y: hidden !important;
      border-right: none !important;
      border-bottom: 2px solid #1a3048 !important;
      padding: 6px 4px !important;
      gap: 2px !important;
      -webkit-overflow-scrolling: touch;
      display: flex !important;
    }
    .allee-btn {
      border-left: none !important;
      border-bottom: 3px solid transparent;
      padding: 8px 14px;
      font-size: 15px;
      white-space: nowrap;
      flex-shrink: 0;
      width: auto !important;
    }
    .allee-btn.active {
      border-left: none !important;
      border-bottom-color: #3a8cc8 !important;
      background: #1a4a7a !important;
    }

    /* ----- Contenu principal : scroll naturel ----- */
    main {
      display: block !important;
      height: auto !important;
      overflow: visible !important;
      padding: 12px 8px !important;
    }

    /* ----- Stats ----- */
    .main-header {
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 12px;
    }
    .allee-title { font-size: 20px; }
    .stats { gap: 5px; flex-wrap: wrap; }
    .stat-box { padding: 5px 8px; }
    .stat-val { font-size: 14px; }
    .stat-lbl { font-size: 8px; }

    /* ----- Légende ----- */
    .legend { font-size: 10px; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }

    /* ----- Grille cages ----- */
    .grid {
      display: grid !important;
      grid-template-columns: repeat(9, 1fr) !important;
      gap: 3px !important;
      max-width: 100% !important;
      width: 100% !important;
    }
    .cage {
      padding: 7px 2px 4px !important;
      border-radius: 4px !important;
      min-height: 38px !important;
    }
    .cage .icon { font-size: 12px !important; }
    .cage .lbl { font-size: 7px !important; }
    .cage.femelle .icon { font-size: 10px !important; }

    /* ----- Boutons actions rapides ----- */
    .quick-actions { gap: 6px; margin-top: 14px; flex-wrap: wrap; }
    .qa-btn { font-size: 10px; padding: 6px 10px; }

    /* ----- Modal ----- */
    .modal {
      min-width: unset !important;
      width: 96vw !important;
      max-width: 96vw !important;
      padding: 14px 12px !important;
      max-height: 88vh !important;
    }
    table { font-size: 11px; }
    th, td { padding: 5px 3px; }
    .btn-close { padding: 8px; font-size: 11px; }
  }

  @media (max-width: 380px) {
    .cage { min-height: 34px !important; }
    .cage .icon { font-size: 11px !important; }
    .cage .lbl { font-size: 6px !important; }
    .btn-bilan { font-size: 9px; padding: 4px 6px; }
  }
</style>
</head>

<div class="layout">
  <nav id="navAllees"></nav>
  <main id="mainContent"></main>
</div>

<div class="modal-overlay" id="modalOverlay" onclick="closeBilan()">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-title" id="modalTitle"></div>
    <table>
      <thead>
        <tr>
          <th>Allée</th>
          <th style="color:#4ade80">✓ Donnés</th>
          <th style="color:#fb923c">~ Moyens</th>
          <th style="color:#f87171">✗ Non donnés</th>
          <th style="color:#4a6a8a">— Non enr.</th>
        </tr>
      </thead>
      <tbody id="bilanBody"></tbody>
    </table>
    <button class="btn-close" onclick="closeBilan()">Fermer</button>
  </div>
</div>

<script>
const ALLEES   = ['A','B','C','D','E','F','G','H','I','J','K','L'];
const NB_CAGES = 81;
const FEMELLES = new Set([1, 22, 39, 56, 73]);
const NB_MALES = NB_CAGES - FEMELLES.size; // 76 mâles

// 0=non enr. | 1=donné | 2=moyen | 3=non donné
const ETAT_LABEL = { 0:'—', 1:'✓', 2:'~', 3:'✗' };
const ETAT_CLASS = { 0:'', 1:'donne', 2:'moyen', 3:'nondonne' };

let currentAllee = 'A';
let currentDate  = today();
let data = {};

function today() { return new Date().toISOString().slice(0, 10); }
function storageKey(date, allee) { return `semence:${date}:${allee}`; }

function saveAllee(date, allee) {
  try { localStorage.setItem(storageKey(date, allee), JSON.stringify(data[allee] || {})); showSaving(); } catch(e) {}
}
function loadAllee(date, allee) {
  try { const v = localStorage.getItem(storageKey(date, allee)); data[allee] = v ? JSON.parse(v) : {}; } catch(e) { data[allee] = {}; }
}
function showSaving() {
  const el = document.getElementById('saving');
  el.textContent = '💾 sauvegardé';
  setTimeout(() => el.textContent = '', 1200);
}

document.addEventListener('DOMContentLoaded', () => {
  const dp = document.getElementById('datePicker');
  dp.value = currentDate;
  dp.addEventListener('change', () => { currentDate = dp.value; data = {}; renderAll(); });
  renderAll();
});

function renderAll() { loadAllee(currentDate, currentAllee); renderNav(); renderMain(); }

function renderNav() {
  const nav = document.getElementById('navAllees');
  nav.innerHTML = '';
  ALLEES.forEach(al => {
    const btn = document.createElement('button');
    btn.className = 'allee-btn' + (al === currentAllee ? ' active' : '');
    btn.textContent = al;
    btn.onclick = () => selectAllee(al);
    nav.appendChild(btn);
  });
}
function selectAllee(al) { currentAllee = al; loadAllee(currentDate, currentAllee); renderNav(); renderMain(); }

function getStats(allee) {
  const d = data[allee] || {};
  let donne=0, moyen=0, nonDonne=0, nonEnr=0;
  for (let i=1; i<=NB_CAGES; i++) {
    if (FEMELLES.has(i)) continue;
    const v = d[i] || 0;
    if      (v===1) donne++;
    else if (v===2) moyen++;
    else if (v===3) nonDonne++;
    else            nonEnr++;
  }
  const evalues = donne + moyen + nonDonne;
  const pctD = evalues ? Math.round((donne / evalues) * 100) : 0;
  const pctM = evalues ? Math.round((moyen / evalues) * 100) : 0;
  const pctND = evalues ? Math.round((nonDonne / evalues) * 100) : 0;
  
  return { donne, moyen, nonDonne, nonEnr, evalues, pctD, pctM, pctND };
}

function renderMain() {
  const s = getStats(currentAllee);

  let cagesHtml = '';
  const cageData = data[currentAllee] || {};

  for (let i=1; i<=NB_CAGES; i++) {
    if (FEMELLES.has(i)) {
      cagesHtml += `<div class="cage femelle" title="${currentAllee}${i} — Femelle (non sélectionnable)">
        <span class="icon">♀</span>
        <span class="lbl">${currentAllee}${i}</span>
      </div>`;
    } else {
      const state = cageData[i] || 0;
      cagesHtml += `<button class="cage ${ETAT_CLASS[state]}" onclick="toggleCage(${i})" title="${currentAllee}${i}">
        <span class="icon">${ETAT_LABEL[state]}</span>
        <span class="lbl">${currentAllee}${i}</span>
      </button>`;
    }
  }

  document.getElementById('mainContent').innerHTML = `
    <div class="main-header">
      <div class="allee-title">Allée <span>${currentAllee}</span></div>
      <div class="stats">
        <div class="stat-box"><div class="stat-val" style="color:#4ade80">${s.donne} <span>(${s.pctD}%)</span></div><div class="stat-lbl">Donnés</div></div>
        <div class="stat-box"><div class="stat-val" style="color:#fb923c">${s.moyen} <span>(${s.pctM}%)</span></div><div class="stat-lbl">Moyens</div></div>
        <div class="stat-box"><div class="stat-val" style="color:#f87171">${s.nonDonne} <span>(${s.pctND}%)</span></div><div class="stat-lbl">Non donnés</div></div>
        <div class="stat-box"><div class="stat-val" style="color:#4a6a8a">${s.nonEnr}</div><div class="stat-lbl">Non enr.</div></div>
        <div class="stat-box"><div class="stat-val" style="color:#3a8cc8">${s.evalues}/${NB_MALES}</div><div class="stat-lbl">Évalués</div></div>
      </div>
    </div>
    
    <div class="progress-wrap">
      <div class="progress-bar" style="width:${s.pctD}%;background:#16a34a"></div>
      <div class="progress-bar" style="width:${s.pctM}%;background:#d97706"></div>
      <div class="progress-bar" style="width:${s.pctND}%;background:#dc2626"></div>
    </div>
    
    <div class="legend">
      <span>APPUYER POUR BASCULER :</span>
      <span><span class="ldot" style="background:#2a3a4a;border:1px solid #3a4a5a"></span><span style="color:#4a6070">— Non enreg.</span></span>
      <span><span class="ldot" style="background:#16a34a"></span><span style="color:#4ade80">✓ Donné</span></span>
      <span><span class="ldot" style="background:#d97706"></span><span style="color:#fb923c">~ Moyen</span></span>
      <span><span class="ldot" style="background:#dc2626"></span><span style="color:#f87171">✗ Non donné</span></span>
      <span style="opacity:0.45">| ♀ = femelle verrouillée</span>
    </div>
    <div class="grid">${cagesHtml}</div>
    <div class="quick-actions">
      <button class="qa-btn" style="background:#0d3d1f;border-color:#16a34a;color:#4ade80" onclick="markAll(1)">Tout ✓ Donné</button>
      <button class="qa-btn" style="background:#3d2800;border-color:#d97706;color:#fb923c"  onclick="markAll(2)">Tout ~ Moyen</button>
      <button class="qa-btn" style="background:#3d0d0d;border-color:#dc2626;color:#f87171" onclick="markAll(3)">Tout ✗ Non donné</button>
      <button class="qa-btn" style="background:#1a2e42;border-color:#2a4a68;color:#4a6a8a" onclick="markAll(0)">Réinitialiser</button>
    </div>
  `;
}

function toggleCage(num) {
  if (FEMELLES.has(num)) return;
  if (!data[currentAllee]) data[currentAllee] = {};
  const cur = data[currentAllee][num] || 0;
  data[currentAllee][num] = (cur + 1) % 4;
  saveAllee(currentDate, currentAllee);
  renderMain();
}

function markAll(val) {
  if (!data[currentAllee]) data[currentAllee] = {};
  for (let i=1; i<=NB_CAGES; i++) {
    if (!FEMELLES.has(i)) data[currentAllee][i] = val;
  }
  saveAllee(currentDate, currentAllee);
  renderMain();
}

// --- Bilan global ---
function openBilan() {
  ALLEES.forEach(al => { if (!data[al]) loadAllee(currentDate, al); });
  document.getElementById('modalTitle').textContent = `Bilan du ${currentDate} · ${NB_MALES} mâles/allée`;
  let totD=0, totM=0, totND=0, totNE=0, rows='';
  ALLEES.forEach(al => {
    const s = getStats(al);
    totD+=s.donne; totM+=s.moyen; totND+=s.nonDonne; totNE+=s.nonEnr;
    rows += `<tr>
      <td>${al}</td>
      <td style="color:#4ade80">${s.donne} <span>(${s.pctD}%)</span></td>
      <td style="color:#fb923c">${s.moyen} <span>(${s.pctM}%)</span></td>
      <td style="color:#f87171">${s.nonDonne} <span>(${s.pctND}%)</span></td>
      <td style="color:#4a6a8a">${s.nonEnr}</td>
    </tr>`;
  });
  
  const totEval = totD + totM + totND;
  const totPctD = totEval ? Math.round((totD / totEval) * 100) : 0;
  const totPctM = totEval ? Math.round((totM / totEval) * 100) : 0;
  const totPctND = totEval ? Math.round((totND / totEval) * 100) : 0;

  rows += `<tr class="total-row">
    <td style="color:#e8f4ff">TOTAL</td>
    <td style="color:#4ade80">${totD} (${totPctD}%)</td>
    <td style="color:#fb923c">${totM} (${totPctM}%)</td>
    <td style="color:#f87171">${totND} (${totPctND}%)</td>
    <td style="color:#4a6a8a">${totNE}</td>
  </tr>`;
  
  document.getElementById('bilanBody').innerHTML = rows;
  document.getElementById('modalOverlay').classList.add('open');
}
function closeBilan() { document.getElementById('modalOverlay').classList.remove('open'); }

// --- Export CSV ---
function exportCSV(mode) {
  let dates = [];
  if (mode === 'tout') {
    const keys = Object.keys(localStorage).filter(k => k.startsWith('semence:'));
    dates = Array.from(new Set(keys.map(k => k.split(':')[1]))).sort();
  } else {
    dates = [currentDate];
  }

  const rows = [];
  rows.push(['Date','Allée','Cage','Type','Résultat','Code']);
  dates.forEach(date => {
    ALLEES.forEach(al => {
      let d = {};
      try { const v=localStorage.getItem(storageKey(date,al)); d=v?JSON.parse(v):{}; } catch(e){}
      for (let i=1; i<=NB_CAGES; i++) {
        if (FEMELLES.has(i)) {
          rows.push([date, al, al+i, 'Femelle', 'N/A', '']);
        } else {
          const val = d[i]||0;
          const label = val===1?'Donné':val===2?'Moyen':val===3?'Non donné':'Non enregistré';
          rows.push([date, al, al+i, 'Mâle', label, val]);
        }
      }
    });
  });

  rows.push([]);
  rows.push(['--- RÉCAPITULATIF (mâles uniquement) ---']);
  rows.push(['Date','Allée','Donnés','% Donnés','Moyens','% Moyens','Non donnés','% Non donnés','Non enr.','Total évalués','Total mâles']);
  
  dates.forEach(date => {
    ALLEES.forEach(al => {
      let d={};
      try { const v=localStorage.getItem(storageKey(date,al)); d=v?JSON.parse(v):{}; } catch(e){}
      let don=0,moy=0,ndon=0,nenr=0;
      for (let i=1;i<=NB_CAGES;i++) {
        if (FEMELLES.has(i)) continue;
        const val=d[i]||0;
        if(val===1)don++; else if(val===2)moy++; else if(val===3)ndon++; else nenr++;
      }
      
      const evalues = don + moy + ndon;
      const pctD = evalues ? Math.round((don / evalues) * 100) : 0;
      const pctM = evalues ? Math.round((moy / evalues) * 100) : 0;
      const pctND = evalues ? Math.round((ndon / evalues) * 100) : 0;
      
      rows.push([date, al, don, pctD+'%', moy, pctM+'%', ndon, pctND+'%', nenr, evalues, NB_MALES]);
    });
  });

  const csv = rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(';')).join('\n');
  const blob = new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = mode==='tout'?`semence_export_complet_${today()}.csv`:`semence_${currentDate}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}
</script>
